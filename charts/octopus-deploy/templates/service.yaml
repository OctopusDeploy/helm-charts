apiVersion: v1
kind: Service
metadata:
  name: {{ template "octopus.fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  type: {{ .Values.octopus.service.type }}
  selector:
    {{- include "octopus.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: {{.Values.octopus.webPort}}
      targetPort: 8080
      protocol: TCP
    - name: grpcs
      port: {{.Values.octopus.grpcPort}}
      targetPort: {{.Values.octopus.grpcPort}}
      protocol: TCP
  {{- if or (eq (.Values.octopus.replicaCount | int) 1) .Values.octopus.multiNodePollingTentacles.enabled }} # If there is only one node, or any node can serve polling tentacles, expose the tentacle along with the web port
    - name: tentacle
      port: {{.Values.octopus.tentaclePort}}
      targetPort: 10943
      protocol: TCP
  {{- end }}
  {{- if and (gt (.Values.octopus.replicaCount | int) 1) (not .Values.octopus.multiNodePollingTentacles.enabled) }} # With multi-node support for polling tentacles, tentacles don't need to reach each node
  {{- range untilStep 0 (.Values.octopus.replicaCount | int) 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: octopus-deploy-node{{ . }}
  labels:
    {{ include "labels" $ | nindent 4 }}
spec:
  type: {{ $.Values.octopus.service.type }}
  ports:
    - name: web
      port: {{$.Values.octopus.webPort}}
      targetPort: 8080
      protocol: TCP
    - name: grpcs
      port: {{$.Values.octopus.grpcPort}}
      targetPort: {{$.Values.octopus.grpcPort}}
      protocol: TCP
    - name: tentacle
      port: {{$.Values.octopus.tentaclePort}}
      targetPort: 10943
      protocol: TCP
  selector:
    statefulset.kubernetes.io/pod-name: {{ template "octopus.fullname" $ }}-{{ . }}
{{- end }}
{{- end }}