apiVersion: v1
kind: Service
metadata:
  name: {{ include "octopus.redis.fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "redis.selectorLabels" . | nindent 4 }}
