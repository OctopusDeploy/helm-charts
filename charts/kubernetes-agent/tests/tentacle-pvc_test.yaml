suite: "persistence"
templates:
- templates/tentacle-pvc.yaml
tests:
- it: "should match snapshot when storageClassName is not set"
  asserts:
    - matchSnapshot: {}

- it: "should match snapshot when storageClassName is set"
  set:
    persistence:
      storageClassName: "my-storage-class"
  asserts:
    - matchSnapshot: {}

- it: "should match snapshot when volumeName is set"
  set:
    persistence:
      volumeName: "my-volume"
  asserts:
    - matchSnapshot: {}

    
- it: "should match snapshot when storageClassName is set to \"-\""
  set:
    persistence:
      storageClassName: "-"
      volumeName: "my-volume"
  asserts:
    - matchSnapshot: {}

- it: "can have the size changed"
  set:
    persistence:
      storageClassName: "my-storage-class"
      size: 16Gi
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: spec.resources.requests.storage
      value: 16Gi

