name: Release Please

on:
  push:
    branches:
    - main
    - release/kubernetes-agent/v*
    - release/octopus-deploy/v*
    - octopus-v1
    - vnext/v*

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      ka_release_created: ${{ steps.release.outputs['charts/kubernetes-agent--release_created'] }}
      od_release_created: ${{ steps.release.outputs['charts/octopus-deploy--release_created'] }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
    - uses: googleapis/release-please-action@v5
      id: release
      with:
        # A PAT is used so the release PR and tags trigger other workflows
        token: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
        target-branch: ${{ github.ref_name }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

  # release-please only bumps Chart.yaml and CHANGELOG.md, so regenerate the files that embed the chart version
  update-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        token: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}

    - name: setup-helm
      uses: azure/setup-helm@v5.0.1
      with:
        version: v3.19.4

    - name: 'Update version in Kubernetes Agent test snapshots'
      run: |
        helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3
        helm unittest -u charts/kubernetes-agent

    - name: 'Update version in Kubernetes Agent Readme'
      working-directory: charts/kubernetes-agent
      run: npm run generate-agent-docs

    - name: 'Push changes'
      run: |
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add charts/kubernetes-agent/tests/__snapshot__ charts/kubernetes-agent/README.md
        if git diff --cached --quiet; then
          echo "No generated files changed"
          exit 0
        fi
        git commit -m "chore: update generated files for chart version"
        git push

  publish-kubernetes-agent:
    needs: release-please
    if: ${{ needs.release-please.outputs.ka_release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/kubernetes-agent-publish-chart.yaml
    with:
      release: true
    secrets: inherit

  publish-octopus-deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.od_release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/octopus-publish-chart.yml
    with:
      release: true
    secrets: inherit
